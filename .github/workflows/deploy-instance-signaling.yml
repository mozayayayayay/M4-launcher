name: Deploy M4 signaling service

on:
  push:
    branches: [main]
    paths:
      - "services/instance-signaling/**"
      - ".github/workflows/deploy-instance-signaling.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install signaling service dependencies
        working-directory: services/instance-signaling
        run: npm install
      - name: Type-check signaling service
        working-directory: services/instance-signaling
        run: npm run typecheck
      - name: Deploy signaling service
        working-directory: services/instance-signaling
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
