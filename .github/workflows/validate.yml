name: Validate M4 changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_M4_SIGNALING_URL: https://example.invalid
        run: npm run build
      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        env:
          VITE_M4_SIGNALING_URL: https://example.invalid
        run: npm run build
      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  signaling-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install signaling dependencies
        working-directory: services/instance-signaling
        run: npm install
      - name: Type-check signaling service
        working-directory: services/instance-signaling
        run: npm run typecheck
