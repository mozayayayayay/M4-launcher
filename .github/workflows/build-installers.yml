name: Build M4 installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux .deb
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            librsvg2-dev patchelf
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Build .deb
        run: npm run tauri -- build --bundles deb
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: M4-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows Setup.exe
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install NSIS
        run: choco install nsis -y
      - name: Install frontend dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: M4-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: M4-Linux-deb
          path: release-assets
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: M4-Windows-Setup
          path: release-assets
      - name: Publish release and installers
        uses: softprops/action-gh-release@v2
        with:
          name: M4 Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
