name: Build installers and publish updater manifest

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m0z4-installer-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux DEB
            platform: ubuntu-24.04
            args: --bundles deb
          - name: Windows setup
            platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify direct-sharing signaling service
        env:
          M4_SIGNALING_URL: ${{ vars.M4_SIGNALING_URL }}
        shell: bash
        run: |
          if [[ -z "${M4_SIGNALING_URL}" ]]; then
            echo "::error::Set the M4_SIGNALING_URL repository variable to the deployed signaling Worker URL before releasing 0.1.6."
            exit 1
          fi
          curl --fail --silent --show-error "${M4_SIGNALING_URL%/}/health"

      - name: Validate frontend
        env:
          VITE_M4_SIGNALING_URL: ${{ vars.M4_SIGNALING_URL }}
        run: npm run build

      - name: Validate Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate updater signing keys
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          M0Z4_UPDATER_PUBLIC_KEY: ${{ vars.M0Z4_UPDATER_PUBLIC_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" || -z "${M0Z4_UPDATER_PUBLIC_KEY}" ]]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY as a repository Actions secret and M0Z4_UPDATER_PUBLIC_KEY as a repository Actions variable before building signed updates."
            exit 1
          fi

      - name: Configure updater public key
        shell: bash
        env:
          M0Z4_UPDATER_PUBLIC_KEY: ${{ vars.M0Z4_UPDATER_PUBLIC_KEY }}
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.plugins.updater.pubkey=process.env.M0Z4_UPDATER_PUBLIC_KEY; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\\n');"

      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_M4_SIGNALING_URL: ${{ vars.M4_SIGNALING_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          M0Z4_UPDATER_PUBLIC_KEY: ${{ vars.M0Z4_UPDATER_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: M0Z4 Launcher v__VERSION__
          releaseBody: |
            M0Z4 Launcher v0.1.6

            - Share complete Minecraft instances directly between M4 users with a one-time code.
            - Encrypted WebRTC peer-to-peer transfer; signaling carries connection metadata only.
            - Share mods, configs, resource packs, shaders, and optional single-player worlds.
            - Recipient approval, transfer progress, archive SHA-256 verification, and safe import.
            - Direct-only networking: no cloud file storage and no file-relay fallback.
            - Share-link creation stays responsive and shows an animated preparation progress bar.
            - Midnight is now pure black with white text; Snowy uses a softer, less bright palette.
            - Settings number fields have clearer, more polished controls.

            Choose the Linux .deb package or Windows setup.exe installer below.
            Signed update packages and latest.json enable in-app updates.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-updater-manifest:
    name: Publish signed updater manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create latest.json from both signed release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="v${version}"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          deb_name="$(printf '%s' "${release_json}" | jq -r '[.assets[].name | select(endswith(".deb"))][0] // empty')"
          exe_name="$(printf '%s' "${release_json}" | jq -r '[.assets[].name | select(endswith(".exe"))][0] // empty')"
          if [[ -z "${deb_name}" || -z "${exe_name}" ]]; then
            echo "Expected Linux .deb and Windows .exe release assets were not found."
            exit 1
          fi
          deb_sig_name="${deb_name}.sig"
          exe_sig_name="${exe_name}.sig"
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern "${deb_sig_name}" --dir updater-assets
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern "${exe_sig_name}" --dir updater-assets
          deb_url="$(printf '%s' "${release_json}" | jq -r --arg n "${deb_name}" '.assets[] | select(.name == $n) | .browser_download_url')"
          exe_url="$(printf '%s' "${release_json}" | jq -r --arg n "${exe_name}" '.assets[] | select(.name == $n) | .browser_download_url')"
          notes="$(printf '%s' "${release_json}" | jq -r '.body // ""')"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg version "${version}" \
            --arg notes "${notes}" \
            --arg pub_date "${pub_date}" \
            --arg deb_url "${deb_url}" \
            --arg deb_sig "$(cat "updater-assets/${deb_sig_name}")" \
            --arg exe_url "${exe_url}" \
            --arg exe_sig "$(cat "updater-assets/${exe_sig_name}")" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"linux-x86_64":{url:$deb_url,signature:$deb_sig},"windows-x86_64":{url:$exe_url,signature:$exe_sig}}}' > latest.json
          gh release upload "${tag}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber
